
services:
  # Main application
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgres://postgres:postgres@db:5432/rail_service_dev?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PASSWORD=
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - ENRICHMENT_SERVICE_URL=http://enrichment:8090
      - DOCUMENT_OCR_SERVICE_URL=${DOCUMENT_OCR_SERVICE_URL:-http://ocr:8091}
      - DOCUMENT_ENABLE_PYTHON_OCR=${DOCUMENT_ENABLE_PYTHON_OCR:-false}
      - PLATFORM_ENABLED=${PLATFORM_ENABLED:-false}
      - PLATFORM_AMQP_URL=${PLATFORM_AMQP_URL:-amqp://rail:rail@rabbitmq:5672}
      - PLATFORM_AMQP_EXCHANGE=${PLATFORM_AMQP_EXCHANGE:-miriam}
      - PLATFORM_BRIDGE_HMAC_SECRET=${PLATFORM_BRIDGE_HMAC_SECRET:-dev-hmac-secret-change-in-prod}
      - PLATFORM_BRIDGE_BASE_URL=http://spectrum-bridge:3000
      - PLATFORM_BRIDGE_MESSAGING_ADDRESS=${PLATFORM_BRIDGE_MESSAGING_ADDRESS:-}
      - PLATFORM_APP_DEEP_LINK_BASE_URL=${PLATFORM_APP_DEEP_LINK_BASE_URL:-rail://}
      - PLATFORM_HANDSHAKE_TOKEN_TTL_SECONDS=${PLATFORM_HANDSHAKE_TOKEN_TTL_SECONDS:-900}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-unosend}
      - UNOSEND_API_KEY=${UNOSEND_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM_EMAIL=${EMAIL_FROM_EMAIL:-noreply@mail.userail.money}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-RAIL Staging}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO:-support@userail.money}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      enrichment:
        condition: service_healthy
    networks:
      - rail-network
    volumes:
      - ./configs:/configs:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "/main", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=rail_service_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - rail-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rail_service_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  # RabbitMQ (messaging bus for platform bridge)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"  # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: rail
      RABBITMQ_DEFAULT_PASS: rail
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rail-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Spectrum Bridge (platform messaging — iMessage, voice)
  spectrum-bridge:
    build:
      context: ./cmd/spectrum-bridge
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - SPECTRUM_PROJECT_ID=${SPECTRUM_PROJECT_ID:-}
      - SPECTRUM_PROJECT_SECRET=${SPECTRUM_PROJECT_SECRET:-}
      - AMQP_URL=${PLATFORM_AMQP_URL:-amqp://rail:rail@rabbitmq:5672}
      - AMQP_EXCHANGE=${PLATFORM_AMQP_EXCHANGE:-miriam}
      - RAIL_HMAC_SECRET=${PLATFORM_BRIDGE_HMAC_SECRET:-dev-hmac-secret-change-in-prod}
      - BRIDGE_PORT=3000
      - NODE_ENV=development
      - LOG_LEVEL=info
    volumes:
      - spectrum_bridge_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - rail-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./configs/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - rail-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: redis-server /usr/local/etc/redis/redis.conf

  # Database Admin (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@railservice.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - rail-network
    depends_on:
      - db
    profiles:
      - admin
    restart: unless-stopped

  # Redis Admin (RedisInsight)
  redis-insight:
    image: redislabs/redisinsight:latest
    ports:
      - "8001:8001"
    volumes:
      - redisinsight_data:/db
    networks:
      - rail-network
    depends_on:
      - redis
    profiles:
      - admin
    restart: unless-stopped

  # Transaction Enrichment ML Sidecar
  enrichment:
    build:
      context: ./services/enrichment
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    networks:
      - rail-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Document OCR Service (PaddleOCR + OpenCV) — internal only, no public port
  ocr:
    build:
      context: ./services/ocr
      dockerfile: Dockerfile
    expose:
      - "8091"
    networks:
      - rail-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Mailpit (Email Testing)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - rail-network
    restart: unless-stopped

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - rail-network
    profiles:
      - monitoring
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./configs/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - rail-network
    depends_on:
      - prometheus
    profiles:
      - monitoring
    restart: unless-stopped

  # Nginx reverse proxy (production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/ssl:/etc/nginx/ssl:ro
    networks:
      - rail-network
    depends_on:
      - app
    profiles:
      - production
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
  spectrum_bridge_data:
    driver: local
  pgadmin_data:
    driver: local
  redisinsight_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  rail-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16