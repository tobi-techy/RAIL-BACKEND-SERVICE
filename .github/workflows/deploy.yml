name: Deploy to AWS

on:
  push:
    branches: [staging, main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: rail-backend

jobs:
  deploy:
    name: Build → Push ECR → Deploy ECS (${{ github.ref_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ENV: ${{ steps.env.outputs.env }}
        run: |
          docker buildx create --use --driver docker-container
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=registry,ref=$REGISTRY/$ECR_REPOSITORY:$ENV-cache \
            --cache-to   type=registry,ref=$REGISTRY/$ECR_REPOSITORY:$ENV-cache,mode=max \
            --tag $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --tag $REGISTRY/$ECR_REPOSITORY:$ENV-latest \
            --push \
            .
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: rail-${{ steps.env.outputs.env }}
          container-name: rail-backend
          image: ${{ steps.build.outputs.image }}

      - name: Register ECS task definition
        id: register-task-def
        run: |
          jq '{
            family,
            taskRoleArn,
            executionRoleArn,
            networkMode,
            containerDefinitions,
            volumes,
            placementConstraints,
            requiresCompatibilities,
            cpu,
            memory,
            tags,
            pidMode,
            ipcMode,
            proxyConfiguration,
            inferenceAccelerators,
            ephemeralStorage,
            runtimePlatform
          } | with_entries(select(.value != null and .value != []))' \
            "${{ steps.task-def.outputs.task-definition }}" > task-definition-register.json

          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-register.json \
            --region "${{ env.AWS_REGION }}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task-definition-arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          ENV: ${{ steps.env.outputs.env }}
          TASK_DEFINITION_ARN: ${{ steps.register-task-def.outputs.task-definition-arn }}
        run: |
          set -euo pipefail

          CLUSTER="rail-$ENV"
          SERVICE="rail-$ENV"

          if ! LAUNCH_TYPE=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "${{ env.AWS_REGION }}" \
            --query 'services[0].launchType' \
            --output text); then
            echo "Failed to retrieve launch type for ECS service $SERVICE in cluster $CLUSTER"
            exit 1
          fi

          if [ -z "$LAUNCH_TYPE" ] || [ "$LAUNCH_TYPE" = "None" ]; then
            echo "Failed to retrieve launch type for ECS service $SERVICE in cluster $CLUSTER"
            exit 1
          fi

          RUN_TASK_ARGS=(
            --cluster "$CLUSTER"
            --task-definition "$TASK_DEFINITION_ARN"
            --overrides '{"containerOverrides":[{"name":"rail-backend","command":["migrate"]}]}'
            --region "${{ env.AWS_REGION }}"
            --query 'tasks[0].taskArn'
            --output text
          )

          if [ "$LAUNCH_TYPE" = "FARGATE" ]; then
            if ! NETWORK_CONFIGURATION=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --region "${{ env.AWS_REGION }}" \
              --query 'services[0].networkConfiguration.awsvpcConfiguration' \
              --output json); then
              echo "Failed to retrieve network configuration for Fargate ECS service $SERVICE in cluster $CLUSTER"
              exit 1
            fi

            if [ -z "$NETWORK_CONFIGURATION" ] || [ "$NETWORK_CONFIGURATION" = "null" ]; then
              echo "Fargate ECS service $SERVICE in cluster $CLUSTER requires a valid network configuration"
              exit 1
            fi

            SUBNETS=$(echo "$NETWORK_CONFIGURATION" | jq -r '.subnets | join(",")')
            SECURITY_GROUPS=$(echo "$NETWORK_CONFIGURATION" | jq -r '.securityGroups | join(",")')
            ASSIGN_PUBLIC_IP=$(echo "$NETWORK_CONFIGURATION" | jq -r '.assignPublicIp // "DISABLED"')

            RUN_TASK_ARGS+=(
              --launch-type FARGATE
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=$ASSIGN_PUBLIC_IP}"
            )
          else
            RUN_TASK_ARGS+=(--launch-type "$LAUNCH_TYPE")
          fi

          set +e
          TASK_ARN=$(aws ecs run-task "${RUN_TASK_ARGS[@]}" 2>&1)
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "Failed to start migration task:"
            echo "$TASK_ARN"
            exit 1
          fi

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "Failed to start migration task"
            exit 1
          fi

          echo "Started migration task: $TASK_ARN"
          aws ecs wait tasks-stopped \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN" \
            --region "${{ env.AWS_REGION }}"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN" \
            --region "${{ env.AWS_REGION }}" \
            --query 'tasks[0].containers[?name==`rail-backend`].exitCode | [0]' \
            --output text)
          REASON=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN" \
            --region "${{ env.AWS_REGION }}" \
            --query 'tasks[0].stoppedReason' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed with exit code $EXIT_CODE: $REASON"
            exit 1
          fi

          echo "Database migrations completed"

      - name: Deploy to ECS
        env:
          ENV: ${{ steps.env.outputs.env }}
          TASK_DEFINITION_ARN: ${{ steps.register-task-def.outputs.task-definition-arn }}
        run: |
          aws ecs update-service \
            --cluster rail-$ENV \
            --service rail-$ENV \
            --task-definition "$TASK_DEFINITION_ARN" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"

      - name: Verify deployment health
        env:
          ENV: ${{ steps.env.outputs.env }}
        run: |
          echo "Polling ECS until running == desired (max 5 min)..."
          for i in $(seq 1 30); do
            RUNNING=$(aws ecs describe-services \
              --cluster rail-$ENV --services rail-$ENV \
              --region ${{ env.AWS_REGION }} \
              --query 'services[0].runningCount' --output text)
            DESIRED=$(aws ecs describe-services \
              --cluster rail-$ENV --services rail-$ENV \
              --region ${{ env.AWS_REGION }} \
              --query 'services[0].desiredCount' --output text)
            echo "[$i/30] Running: $RUNNING / Desired: $DESIRED"
            [ "$RUNNING" -eq "$DESIRED" ] && [ "$RUNNING" -gt 0 ] && echo "Deployment healthy." && exit 0
            sleep 10
          done
          echo "Deployment unhealthy after 5 min: Running=$RUNNING, Desired=$DESIRED" && exit 1
