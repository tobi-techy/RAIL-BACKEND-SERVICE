name: Deploy to AWS

on:
  push:
    branches: [staging, main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: rail-backend

jobs:
  deploy:
    name: Build → Push ECR → Deploy ECS (${{ github.ref_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ENV: ${{ steps.env.outputs.env }}
        run: |
          docker buildx create --use --driver docker-container
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=registry,ref=$REGISTRY/$ECR_REPOSITORY:$ENV-cache \
            --cache-to   type=registry,ref=$REGISTRY/$ECR_REPOSITORY:$ENV-cache,mode=max \
            --tag $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --tag $REGISTRY/$ECR_REPOSITORY:$ENV-latest \
            --push \
            .
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: rail-${{ steps.env.outputs.env }}
          container-name: rail-backend
          image: ${{ steps.build.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: rail-${{ steps.env.outputs.env }}
          cluster: rail-${{ steps.env.outputs.env }}
          wait-for-service-stability: false

      - name: Verify deployment health
        env:
          ENV: ${{ steps.env.outputs.env }}
        run: |
          echo "Polling ECS until running == desired (max 5 min)..."
          for i in $(seq 1 30); do
            RUNNING=$(aws ecs describe-services \
              --cluster rail-$ENV --services rail-$ENV \
              --region ${{ env.AWS_REGION }} \
              --query 'services[0].runningCount' --output text)
            DESIRED=$(aws ecs describe-services \
              --cluster rail-$ENV --services rail-$ENV \
              --region ${{ env.AWS_REGION }} \
              --query 'services[0].desiredCount' --output text)
            echo "[$i/30] Running: $RUNNING / Desired: $DESIRED"
            [ "$RUNNING" -eq "$DESIRED" ] && [ "$RUNNING" -gt 0 ] && echo "Deployment healthy." && exit 0
            sleep 10
          done
          echo "Deployment unhealthy after 5 min: Running=$RUNNING, Desired=$DESIRED" && exit 1
