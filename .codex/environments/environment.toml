# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "RAIL_BACKEND"

[setup]
script = '''
set -euo pipefail

cd "$CODEX_WORKTREE_PATH"

echo "🚀 Setting up Go backend worktree..."

# Ensure .env exists
if [ ! -f .env ] && [ -f .env.example ]; then
    cp .env.example .env
    echo "Created .env from .env.example"
fi

echo "📦 Downloading Go dependencies..."
go mod download
go mod tidy

echo "🔍 Verifying modules..."
go mod verify

echo "🐳 Starting infrastructure..."
docker compose up -d db redis rabbitmq enrichment

echo "⏳ Waiting for Postgres..."
until docker compose exec -T db pg_isready -U postgres >/dev/null 2>&1; do
    sleep 2
done

echo "🗄 Running database migrations..."
set -a
. .env
set +a
migrate \
    -path migrations \
    -database "$DATABASE_URL" \
    up

echo "🧹 Cleaning old test cache..."
go clean -testcache

echo ""
echo "✅ Worktree ready!"
echo ""
echo "Run:"
echo "    air"'''

[cleanup]
script = '''
#!/usr/bin/env bash
set -euo pipefail

cd "$CODEX_WORKTREE_PATH"

echo "🧹 Cleaning worktree..."

docker compose down --remove-orphans

go clean -cache
go clean -testcache

rm -rf tmp
rm -rf coverage

echo "✅ Cleanup complete."'''

[[actions]]
name = "▶ Start Backend"
icon = "tool"
command = "air"

[[actions]]
name = "🧪 Run Tests"
icon = "tool"
command = "go test ./... -race"
