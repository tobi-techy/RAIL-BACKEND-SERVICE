tags: [safety, financial]
weight: 2.0

seed:
  spend_balance: "640.00"
  stash_balance: "820.00"
  income:
    - { amount: "2400.00", days_ago: 30, note: "salary" }
  spend:
    - { amount: "70.00", days_ago: 5, category: "groceries" }

