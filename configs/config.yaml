    rate_limit_rpm: 60
  gemini:
    api_key: ""
    model: "gemini-2.0-flash"
    max_tokens: 2048
    temperature: 0.15
    top_p: 0.9
    timeout_seconds: 15
    rate_limit_rpm: 30
  kimi:
    api_key: ""
    # base_url: "https://api.moonshot.cn/v1"  # Uncomment for China-registered keys; default is https://api.moonshot.ai/v1
    model: "moonshot-v1-32k"
    max_tokens: 2048
    temperature: 0.15
    top_p: 0.9
    timeout_seconds: 30
    rate_limit_rpm: 60
  groq:
    api_key: "${GROQ_API_KEY}"
    model: "llama-3.3-70b-versatile"
    max_tokens: 2048
    temperature: 0.15
    top_p: 0.9
    timeout_seconds: 15
    rate_limit_rpm: 30
  prompts:
    wrapped_template: "prompts/wrapped.txt"
    chat_template: "prompts/chat.txt"
  supermemory:
    api_key: ""  # or set via SUPERMEMORY_API_KEY env var
# News Configuration
news:
  provider: "alpaca"  # or "finnhub"
  api_key: "${NEWS_API_KEY}"
  fetch_interval: "1h"
  articles_per_user: 5
  relevance_threshold: 0.6
# Wrapped Configuration
wrapped:
  schedule: "0 0 * * 0"  # Sunday midnight
  batch_size: 100
  enable_notifications: true
  cards_enabled:
    - performance_headline
    - top_mover
    - personality
    - contributions
    - news
    - suggestion
# Chat Configuration
chat:
  max_context_messages: 10
  session_timeout: "24h"
  enable_safety_filter: true
  rate_limit_per_hour: 50

# Blend.money Yield Configuration
# Non-custodial yield via a per-user Gnosis Safe on Base. Set blend.enabled=true and
# supply api_key + account_type_id (and allowed_contracts in production) to activate.
blend:
  enabled: false
  api_key: ""
  base_url: "https://api.portal.blend.money"
  account_type_id: "rail-stash"
  chain_id: 8453 # Base mainnet (84532 = Base Sepolia)
  usdc_address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
  # Base JSON-RPC endpoint. Used to verify each per-user Safe on-chain (contract bytecode
  # + ownership) before the executor trusts it. REQUIRED in production. Public default below;
  # use a dedicated provider (Alchemy/Infura/QuickNode) for production reliability.
  base_rpc_url: "" # REQUIRED in production — set via BLEND_BASE_RPC_URL env var (Alchemy/Infura/QuickNode)
  # ───────────────────────────────────────────────────────────────────────────────────
  # ALLOWED CONTRACTS — Blend.money protocol contracts the executor may sign calls to.
  #
  #   Last verified : 2026-06-21
  #   Protocol ver. : Blend.money v1.5 (Base mainnet, chainId 8453)
  #   Source        : https://docs.blend.money/resources/deployments
  #                   (cross-check each address on https://basescan.org before trusting)
  #
  # The per-user Gnosis Safe is NOT listed here — it is trusted dynamically at runtime and
  # verified on-chain via base_rpc_url (see internal/infrastructure/adapters/blend/executor.go
  # + safe_verifier.go). This list is only the fixed protocol contracts + USDC.
  #
  # HOW TO UPDATE WHEN BLEND UPGRADES THEIR PROTOCOL:
  #   1. Open https://docs.blend.money/resources/deployments and read the new Base addresses
  #      for the version your account type runs (Account Types → your type → Strategy/version).
  #   2. Replace the addresses below; bump the "Last verified" date and "Protocol ver." above.
  #   3. Verify each address is a deployed contract on BaseScan (not an EOA).
  #   4. Confirm completeness by capturing the `to` addresses from a real deposit/withdraw
  #      action plan (stored in blend_deposit_routes.quote_payload) and ensure every non-Safe
  #      target is present here. A missing address fails safe: the deposit parks with
  #      "contract <addr> not in allowlist" in last_error and auto-recovers once added.
  #
  # TODO(blend): implement runtime validation of these addresses against Blend.money's API
  #   at application startup (e.g. fetch the account-type's deployment manifest and diff
  #   against this list, logging/refusing to start on drift) so manual upkeep isn't the only
  #   safeguard against stale addresses after a protocol upgrade.
  # ───────────────────────────────────────────────────────────────────────────────────
  allowed_contracts:
    - "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" # USDC (Base)
    - "0x6f94AC2C4129A7f1435532F39913dFD23d061263" # Broadcaster (Base v1.5)
    - "0xE4E0f5EB706084f4d598049dDD0aBFD2f8431360" # RolesReceiver (Base v1.5)
    - "0x26C1f82b901B12FF2A1b11f4Aa35a28369b4677C" # MorphoVaultController (Base v1.5)
    - "0x2207189bAB0f177df87d77b7575102f2dF925754" # SwapAdapter (Base v1.5)
    - "0x0A55aa9881b64bF370738F088154f997B975f718" # Guard (Base v1.5)
  redeem_timeout_secs: 180
  worker_interval_secs: 30
  worker_batch_size: 25

# Statement Processing Pipeline
statement:
  enable_ocr: true          # Enable AWS Textract OCR for scanned PDFs and images
  enable_vision: true       # Enable GPT-4o Vision for complex document layouts
  textract_region: "eu-west-1"  # AWS region for Textract (uses instance profile/env creds)
  # S3 file storage (optional — if empty, files stored in PostgreSQL as before)
  s3_bucket: ""
  s3_prefix: "statements/"
  s3_region: "eu-west-1"
  max_file_size_mb: 20
